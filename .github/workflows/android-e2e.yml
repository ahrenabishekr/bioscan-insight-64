name: Android E2E + Report Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Install Appium + driver
        run: |
          npm install --save-dev appium appium-uiautomator2-driver webdriverio
          npx appium driver install uiautomator2 || echo "driver already present, continuing"

      - name: Run Appium tests on emulator
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            npx appium --allow-insecure uiautomator2:chromedriver_autodownload &
            APPIUM_PID=$!
            for i in $(seq 1 30); do
              curl -s http://localhost:4723/status > /dev/null && break
              sleep 2
            done
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            BUILD_NUM="${{ github.run_number }}" node tests/appium/chemosense.appium.cjs
            TEST_EXIT=$?
            kill $APPIUM_PID || true
            exit $TEST_EXIT
        continue-on-error: true

      - name: Summarize results
        id: summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            PASS=$(grep -oP '(?<=Passed: )\d+' "Test Results/Summary/summary.md" || echo 0)
            FAIL=$(grep -oP '(?<=Failed: )\d+' "Test Results/Summary/summary.md" || echo 0)
            TOTAL=$(grep -oP '(?<=Total Tests: )\d+' "Test Results/Summary/summary.md" || echo 0)
          else
            PASS=0; FAIL=0; TOTAL=0
          fi
          {
            echo "# Android Appium Test Summary"
            echo ""
            echo "Build Number: ${{ github.run_number }}"
            echo "Execution Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Total Tests: $TOTAL"
            echo "Passed: $PASS"
            echo "Failed: $FAIL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-results-${{ github.run_number }}
          path: "Test Results/"
          if-no-files-found: warn

  selenium-web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install dependencies
        run: npm install

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium tests against live site
        run: npm run test:selenium
        continue-on-error: true

      - name: Upload Selenium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report-${{ github.run_number }}
          path: "tests/reports/"
          if-no-files-found: warn

  dast-security-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout backend (not a real git submodule, clone separately)
        uses: actions/checkout@v4
        with:
          repository: ahrenabishekr/chemosense-backend
          path: bioscan-backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Generate fresh JWTs and build input.json
        env:
          DAST_DOCTOR_PASSWORD: ${{ secrets.DAST_DOCTOR_PASSWORD }}
        run: |
          BASE="https://chemosense-backend.onrender.com"
          DEMO_TOKEN=$(curl -s -X POST "$BASE/api/login" -H "Content-Type: application/json" -d '{"student_id":"demo","password":"demo123"}' | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          DOCTOR_LOGIN=$(curl -s -X POST "$BASE/api/login" -H "Content-Type: application/json" -d "{\"student_id\":\"dast_doctor\",\"password\":\"$DAST_DOCTOR_PASSWORD\"}")
          DOCTOR_TOKEN=$(echo "$DOCTOR_LOGIN" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).token || ''}catch(e){''}")
          if [ -z "$DOCTOR_TOKEN" ]; then
            curl -s -X POST "$BASE/api/register" -H "Content-Type: application/json" -d "{\"student_id\":\"dast_doctor\",\"email\":\"dast_doctor@chemosense.app\",\"password\":\"$DAST_DOCTOR_PASSWORD\",\"name\":\"DAST Test Doctor\",\"role\":\"doctor\"}" > /dev/null
            DOCTOR_TOKEN=$(curl -s -X POST "$BASE/api/login" -H "Content-Type: application/json" -d "{\"student_id\":\"dast_doctor\",\"password\":\"$DAST_DOCTOR_PASSWORD\"}" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          fi
          cat > bioscan-backend/automated_test/input.json << JSON
          {
            "baseUrl": "$BASE",
            "technician": "$DEMO_TOKEN",
            "doctor": "$DOCTOR_TOKEN"
          }
          JSON

      - name: Run DAST suite
        run: node bioscan-backend/automated_test/dast-runner.cjs
        continue-on-error: true

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report-${{ github.run_number }}
          path: "bioscan-backend/automated_test/report.json"
          if-no-files-found: warn

  k6-load-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 load test against live backend
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/load-test.js
          flags: --summary-export=k6-summary.json
        continue-on-error: true

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-${{ github.run_number }}
          path: "k6-summary.json"
          if-no-files-found: warn

  combine-and-deploy:
    needs: [build-and-test, selenium-web-tests, dast-security-scan, k6-load-test]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Download Appium results
        uses: actions/download-artifact@v4
        with:
          name: appium-results-${{ github.run_number }}
          path: artifacts/appium
        continue-on-error: true

      - name: Download Selenium results
        uses: actions/download-artifact@v4
        with:
          name: selenium-report-${{ github.run_number }}
          path: artifacts/selenium
        continue-on-error: true

      - name: Download DAST results
        uses: actions/download-artifact@v4
        with:
          name: dast-report-${{ github.run_number }}
          path: artifacts/dast
        continue-on-error: true

      - name: Download k6 results
        uses: actions/download-artifact@v4
        with:
          name: k6-report-${{ github.run_number }}
          path: artifacts/k6
        continue-on-error: true

      - name: Build combined report
        run: |
          mkdir -p pages-out/reports/latest "pages-out/reports/history/build-${{ github.run_number }}"
          node tests/merge-report.cjs \
            artifacts/selenium/selenium-report.json \
            artifacts/appium/Summary/summary.md \
            artifacts/dast/report.json \
            artifacts/k6/k6-summary.json \
            pages-out/reports/latest/index.html
          if [ -d "artifacts/appium/HTML" ]; then
            cp -r artifacts/appium/HTML/. pages-out/reports/latest/appium/ 2>/dev/null || true
          fi
          cp -r pages-out/reports/latest/. "pages-out/reports/history/build-${{ github.run_number }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
